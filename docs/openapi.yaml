openapi: 3.2.1
info:
  title: Hospital API
  summary: API REST hospitalaria - Clase 8 / Tarea 014
  description: Proyecto educativo Node.js, Express, Sequelize y PostgreSQL. Incluye los endpoints previos de usuarios,
    login y roles de Clase 7. El recurso se denomina Appointments. El login no emite token; x-user-role simula autorización
    y es inseguro para producción.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Estado del servicio
  - name: Users
    description: Gestión de usuarios y roles de Clase 7
  - name: Auth
    description: Comprobación de credenciales, sin token
  - name: Patients
    description: Gestión de pacientes
  - name: Doctors
    description: Gestión de médicos y especialidad asociada
  - name: Nurses
    description: Gestión de enfermeros
  - name: Appointments
    description: Atenciones entre paciente y médico, con fecha y motivo
  - name: Specialties
    description: Catálogo de especialidades de solo lectura
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Estado de la API
      operationId: getHealth
      security: []
      responses:
        '200':
          description: La API está disponible
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    examples:
                      - ok
              examples:
                example:
                  value:
                    status: ok
  /api/users:
    get:
      tags:
        - Users
      summary: Listar users
      operationId: listUsers
      description: Ordenado por id ascendente.
      responses:
        '200':
          description: Colección de users
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
              examples:
                example:
                  value:
                    data:
                      - id: 1
                        name: Ada Lovelace
                        email: ada@example.com
                        role: ROLE_USER
    post:
      tags:
        - Users
      summary: Crear User
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            examples:
              example:
                value:
                  name: Ada Lovelace
                  email: ada@example.com
                  password: ClaveDePrueba123!
      responses:
        '201':
          description: User creado correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              examples:
                example:
                  value:
                    data:
                      id: 1
                      name: Ada Lovelace
                      email: ada@example.com
                      role: ROLE_USER
          headers:
            Location:
              description: Ruta del recurso creado
              schema:
                type: string
                examples:
                  - /api/users/1
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EmailTaken'
  /api/users/search:
    get:
      tags:
        - Users
      summary: Buscar users
      operationId: searchUsers
      description: Buscar por palabra clave sin distinguir mayúsculas de minúsculas.
      parameters:
        - name: keywords
          in: query
          required: false
          description: Búsqueda insensible a mayúsculas y minúsculas; se busca en nombre, apellido o identificador
            según el recurso
          schema:
            type: string
            examples:
              - Lovelace
      responses:
        '200':
          description: Resultado de búsqueda en users
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
              examples:
                example:
                  value:
                    data:
                      - id: 1
                        name: Ada Lovelace
                        email: ada@example.com
                        role: ROLE_USER
  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Users
      summary: Obtener User por ID
      operationId: getUserById
      responses:
        '200':
          description: User encontrado
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              examples:
                example:
                  value:
                    data:
                      id: 1
                      name: Ada Lovelace
                      email: ada@example.com
                      role: ROLE_USER
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/UserNotFound'
    patch:
      tags:
        - Users
      summary: Actualizar User parcialmente
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            examples:
              example:
                value:
                  name: Ada Byron
      responses:
        '200':
          description: User actualizado
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              examples:
                example:
                  value:
                    data:
                      id: 1
                      name: Ada Lovelace
                      email: ada@example.com
                      role: ROLE_USER
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/EmailTaken'
    delete:
      tags:
        - Users
      summary: Eliminar User
      operationId: deleteUser
      responses:
        '204':
          description: User eliminado; respuesta sin body
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/UserNotFound'
